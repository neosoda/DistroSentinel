      <rect x="201" y="42" width="73" height="14" rx="7" fill="#373E6A"/>
      <g transform="translate(22 93)">
        <rect width="256" height="49" rx="11" fill="#2B355D" stroke="#7C8AFF" stroke-opacity=".28"/>
        <circle cx="25" cy="24.5" r="12" fill="#A0A5FF"/><path d="M19 28L25 17L31 28Z" fill="#242B55"/>
        <text x="47" y="20" fill="#F5F5FF" font-size="14" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Arch Linux</text>
        <text x="47" y="35" fill="#A4B1D6" font-size="10.5" font-family="Inter,Segoe UI,Arial,sans-serif">Flexibilité · Rolling release</text>
        <circle cx="232" cy="25" r="4" fill="#8DE0BE"/>
      </g>
      <g transform="translate(22 150)">
        <rect width="256" height="49" rx="11" fill="#242D50" stroke="#7C8AFF" stroke-opacity=".17"/>
        <circle cx="25" cy="24.5" r="12" fill="#7ABBEF"/><path d="M22 15V35M28 15V35M18 25H32" stroke="#182641" stroke-width="1.6"/>
        <text x="47" y="20" fill="#F5F5FF" font-size="14" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Debian</text>
        <text x="47" y="35" fill="#A4B1D6" font-size="10.5" font-family="Inter,Segoe UI,Arial,sans-serif">Stabilité · Polyvalence</text>
        <circle cx="232" cy="25" r="4" fill="#8DE0BE"/>
      </g>
      <g transform="translate(22 207)">
        <rect width="256" height="49" rx="11" fill="#242D50" stroke="#7C8AFF" stroke-opacity=".17"/>
        <circle cx="25" cy="24.5" r="12" fill="#C3A0FF"/><path d="M18 26L25 17L32 26L25 33Z" fill="#283057"/>
        <text x="47" y="20" fill="#F5F5FF" font-size="14" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Fedora</text>
        <text x="47" y="35" fill="#A4B1D6" font-size="10.5" font-family="Inter,Segoe UI,Arial,sans-serif">Innovation · Workstation</text>
        <circle cx="232" cy="25" r="4" fill="#8DE0BE"/>
      </g>
    </g>
    <circle cx="717" cy="111" r="6" fill="#B1B6FF" opacity=".8"/><circle cx="1113" cy="301" r="5" fill="#9BE2DC" opacity=".6"/>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="24" fill="none" stroke="#777AC1" stroke-opacity=".32" stroke-width="2"/>
